name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit

      - name: Lint with flake8
        run: |
          # stop on syntax errors or undefined names
          flake8 mirror.py mirror_glass.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 ui/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 mirror.py mirror_glass.py ui/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Security scan with bandit
        if: matrix.os == 'ubuntu-latest'
        run: |
          bandit -r mirror.py mirror_glass.py ui/ -ll --format screen

      - name: Run tests
        run: |
          python -m unittest test_mirror -v

  build:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build classic UI executable
        run: |
          pyinstaller --onefile --windowed --name MirrorPy mirror.py

      - name: Build glassmorphism UI executable
        run: |
          pyinstaller --onefile --windowed --name MirrorPyGlass mirror_glass.py --add-data "ui;ui"

      - name: Upload classic artifact
        uses: actions/upload-artifact@v4
        with:
          name: MirrorPy-windows
          path: dist/MirrorPy.exe
          retention-days: 30

      - name: Upload glassmorphism artifact
        uses: actions/upload-artifact@v4
        with:
          name: MirrorPyGlass-windows
          path: dist/MirrorPyGlass.exe
          retention-days: 30
