name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest test_mirror -v

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_classic: MirrorPy-windows
            artifact_glass: MirrorPyGlass-windows
            ext_classic: .exe
            ext_glass: .exe
          - os: ubuntu-latest
            artifact_classic: MirrorPy-linux
            artifact_glass: MirrorPyGlass-linux
            ext_classic: ""
            ext_glass: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build classic UI executable
        run: |
          pyinstaller --onefile --windowed --name MirrorPy mirror.py

      - name: Build glassmorphism UI executable
        run: |
          pyinstaller --onefile --windowed --name MirrorPyGlass mirror_glass.py --add-data "ui;ui"

      - name: Upload classic artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_classic }}
          path: dist/MirrorPy${{ matrix.ext_classic }}

      - name: Upload glassmorphism artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_glass }}
          path: dist/MirrorPyGlass${{ matrix.ext_glass }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts/ -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/MirrorPy-windows/MirrorPy.exe
            artifacts/MirrorPyGlass-windows/MirrorPyGlass.exe
            artifacts/MirrorPy-linux/MirrorPy
            artifacts/MirrorPyGlass-linux/MirrorPyGlass
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
